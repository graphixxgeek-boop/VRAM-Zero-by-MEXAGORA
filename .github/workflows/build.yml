name: Build VRAM Zero

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Unit tests (no GPU needed)
        run: python -m unittest discover -s tests -v

      - name: Build EXE (PyInstaller)
        shell: cmd
        run: RECREER_EXE.bat

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer\VRAM_Zero.iss

      - name: SHA-256
        shell: pwsh
        run: Get-FileHash installer\Output\*.exe -Algorithm SHA256 | Format-List

      - name: Upload unsigned installer
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: VRAM-Zero-installer-unsigned
          path: installer/Output/*.exe
